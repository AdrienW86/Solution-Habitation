<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">Des territoires et des savoir-faire</title><desc id="description">Schéma éditorial illustratif, création originale. Le réseau. Aucune réalisation ni entreprise représentée.</desc><rect width="1200" height="760" fill="#edf2f5"/><path d="M50 100H1150M50 710H1150" stroke="#cbd8e0"/><path d="M420 140V660" stroke="#cbd8e0"/><text x="55" y="70" fill="#006b99" font-family="Arial,sans-serif" font-size="17">LE RÉSEAU</text><text x="1110" y="70" fill="#142c3b" font-family="Arial,sans-serif" font-size="16">60</text><text x="55" y="245" fill="#142c3b" font-family="Georgia,serif" font-size="35">Des territoires et des</text><text x="55" y="292" fill="#142c3b" font-family="Georgia,serif" font-size="35">savoir-faire</text><text x="55" y="640" fill="#142c3b" font-family="Arial,sans-serif" font-size="15">OBSERVER.</text><text x="55" y="667" fill="#142c3b" font-family="Arial,sans-serif" font-size="15">COMPRENDRE. PRÉPARER.</text><g transform="translate(9 8)"><circle cx="765" cy="205" r="58" fill="#0071af"/><text x="726" y="211" fill="white" font-family="Arial,sans-serif" font-size="17">RÉSEAU</text><path d="M765 263L530 400" fill="none" stroke="#9eafb9" stroke-width="3" stroke-linecap="round"/><rect x="455" y="400" width="150" height="145" rx="3" fill="#ffffff" stroke="#142c3b" stroke-width="3"/><text x="500" y="460" fill="#0071af" font-family="Arial,sans-serif" font-size="40">66</text><text x="479" y="510" fill="#142c3b" font-family="Arial,sans-serif" font-size="14">TERRITOIRE</text><path d="M765 263L740 400" fill="none" stroke="#9eafb9" stroke-width="3" stroke-linecap="round"/><rect x="665" y="400" width="150" height="145" rx="3" fill="#ffffff" stroke="#142c3b" stroke-width="3"/><text x="710" y="460" fill="#0071af" font-family="Arial,sans-serif" font-size="40">11</text><text x="689" y="510" fill="#142c3b" font-family="Arial,sans-serif" font-size="14">TERRITOIRE</text><path d="M765 263L950 400" fill="none" stroke="#9eafb9" stroke-width="3" stroke-linecap="round"/><rect x="875" y="400" width="150" height="145" rx="3" fill="#ffffff" stroke="#142c3b" stroke-width="3"/><text x="920" y="460" fill="#0071af" font-family="Arial,sans-serif" font-size="40">34</text><text x="899" y="510" fill="#142c3b" font-family="Arial,sans-serif" font-size="14">TERRITOIRE</text><text x="505" y="655" fill="#142c3b" font-family="Arial,sans-serif" font-size="16">DÉPARTEMENT → COMMUNE → MÉTIER</text></g><text x="55" y="740" fill="#536875" font-family="Arial,sans-serif" font-size="12">SOLUTION HABITATION · SCHÉMA ILLUSTRATIF</text></svg>